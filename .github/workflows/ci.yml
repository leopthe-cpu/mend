# CI on every push and pull request (addendum §3: "CI runs DB tests and
# typecheck/lint on every push").
#
# Versions: actions/checkout@v4 and supabase/setup-cli@v1 are the ones shown in
# Supabase's own CI testing guide. Bun is installed from npm (package `bun`)
# pinned to the version the lockfile was made with, rather than via a setup
# action whose current version I couldn't verify from this environment.
name: CI

on:
  push:
  pull_request:

# Pull requests: a newer push replaces the run that is now out of date.
# Pushes: every commit keeps its own run and is never cancelled. A new branch
# starts on a commit it shares with develop/main, so cancelling there left red
# "cancelled" marks on that shared commit (and on PRs that contain it).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Lint, typecheck, unit tests, build, secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        run: npm install -g bun@1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Edge Functions run on Deno; type-check them with the Deno CLI from npm
      # (package `deno`, the same version used locally).
      - name: Type-check Edge Functions
        run: npx --yes deno@2.9.6 check supabase/functions/*/index.ts
      - name: No secrets in repo or client bundle
        run: scripts/check-no-secrets.sh .output/public

  db:
    name: Database tests (pgTAP, throwaway local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Same CLI version used locally; the action's default (2.20.3) is too
          # old to parse supabase/config.toml.
          version: 2.119.0
      - name: Start Supabase (local, disposable)
        run: supabase start
      - name: Run pgTAP tests
        run: supabase test db
